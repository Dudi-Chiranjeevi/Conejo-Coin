name: CI - Backend Build + Frontend Build

on:
  push:
    branches:
      - feature-*

jobs:
  ci:
    name: Run Backend + Frontend CI
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------
      # Backend - Django Build Only
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django Build Check
        working-directory: backend
        run: |
          python manage.py collectstatic --noinput || true

      # -----------------------------
      # Frontend - Next.js Build
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: collectibles-inventory
        run: npm ci

      - name: Build Frontend app
        working-directory: collectibles-inventory
        run: npm run build

            # -----------------------------
      # Create PR to dev (Auto)
      # -----------------------------
      - name: Create Pull Request to Dev
        run: |
          gh pr create \
            --base dev \
            --head ${{ github.ref_name }} \
            --title "Auto PR: ${{ github.ref_name }} → dev" \
            --body "CI Passed ✅ Auto-generated PR." \
          || echo "PR already exists"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

